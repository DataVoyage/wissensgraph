# Auslieferung der SPA (§5.1).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Eine Single-Page-Application beantwortet ihr Routing selbst. Jeder unbekannte Pfad muss
    # deshalb index.html liefern, sonst führt ein Neuladen auf einer Unterseite zu einem 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Die Laufzeitkonfiguration darf nicht zwischengespeichert werden: Sie ändert sich bei jedem
    # Umgebungswechsel, und ein Browser mit einer alten config.js spricht die falsche API an.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Gebaute Dateien tragen einen Inhalts-Hash im Namen und können unbegrenzt zwischengespeichert
    # werden.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
