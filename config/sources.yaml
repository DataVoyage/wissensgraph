# Quell-Adapter und ihre Abbildungsregeln (§8.4, §6.3).
#
# Hier stehen KEINE Zugangsdaten. Tokens kommen als ${WG_SOURCE_*__TOKEN} aus der Prozessumgebung
# (§20.2). Ein nicht auflösbarer Platzhalter ohne Rückfallwert ist ein Startfehler (§6.1 Regel 3).
#
# Der Wechsel von den Mock-Quellen auf die echten Systeme ist genau eine Änderung je Quelle:
# WG_SOURCE_CONFLUENCE__BASE_URL zeigt statt auf den Container 'mock-sources' auf die echte
# Instanz, plus ein gültiges Token (§9.4). Kein Codepfad kennt den Unterschied.
#
# Der Store steht bewusst nur zur Kontrolle dabei. Maßgeblich ist der Scope; wohin ein Scope
# schreibt, entscheidet allein config/wissensgraph.yaml (§20.1). Weichen beide voneinander ab,
# bricht der Start ab.
#
# ZUR 'mapping'-SEKTION: Sie schlägt die Vorgaben des Adapters (§8.4) — und das ist bei den
# Inhaltsfeldern selten gewollt. Der Adapter liefert unter 'body' bereits fertiges Markdown; ein
# Eintrag 'body: $.body.storage.value' ersetzte es durch das rohe Storage-Format und machte die
# gesamte Umwandlung wirkungslos, ohne dass irgendetwas fehlschlüge. Dasselbe gilt für 'tags'
# (der Adapter liest beide Antwortformen) und 'resource' (er baut eine absolute Adresse). Ein
# 'mapping' für diese Felder gehört deshalb nur dorthin, wo eine Instanz wirklich abweicht.

sources:
  - name: confluence-eng
    adapter: confluence
    enabled: true
    id_prefix: confluence
    target:
      store: shared
      scope: engineering
      default_type: Confluence Page
    connection:
      base_url: ${WG_SOURCE_CONFLUENCE__BASE_URL:-http://mock-sources:8090/confluence}
      # Die Adresse für Links im erzeugten Text. Hinter einem Gateway ist sie eine andere als
      # die der API; ohne Angabe wird die API-Adresse benutzt.
      web_base_url: ${WG_SOURCE_CONFLUENCE__WEB_URL:-}
      token: ${WG_SOURCE_CONFLUENCE__TOKEN:-}
      timeout_seconds: 30
      rate_limit_per_second: 5
      retries: 3
      page_size: 50
    selection:
      spaces: [ENG, ARCH]
      exclude_labels: [archiv, entwurf]
    schedule:
      cron: 0 */6 * * *
      # Zeitsteuerung ist ausdrücklich außen vor (§24); Läufe werden von Hand ausgelöst. Der
      # Eintrag steht hier, damit die Umstellung später keine Strukturänderung ist.
      enabled: false

  - name: jira-team
    adapter: jira
    enabled: true
    id_prefix: jira
    target:
      store: shared
      scope: engineering
      default_type: Jira Issue
    connection:
      base_url: ${WG_SOURCE_JIRA__BASE_URL:-http://mock-sources:8090/jira}
      web_base_url: ${WG_SOURCE_JIRA__WEB_URL:-}
      token: ${WG_SOURCE_JIRA__TOKEN:-}
      timeout_seconds: 30
      rate_limit_per_second: 5
      retries: 3
      page_size: 50
    selection:
      boards: [TEAM]
      jql_filter: project = TEAM
      # Eine ausdrückliche Feldliste statt '*all': Sie verkleinert die Antwort und damit alles,
      # was danach über sie läuft — bis hin zu den Token des Embeddings.
      fields:
        - summary
        - description
        - issuetype
        - status
        - priority
        - labels
        - updated
        - parent
        - subtasks
        - issuelinks
    schedule:
      cron: 0 */6 * * *
      enabled: false

# ---------------------------------------------------------------------------
# Echte Quellen (§24, Stufe 13)
# ---------------------------------------------------------------------------
#
# Die folgenden Blöcke sind der Betriebsfall. Sie sind auskommentiert, weil ein frisch
# ausgechecktes Repository ohne Zugangsdaten lauffähig bleiben soll; zum Aktivieren genügt
# Auskommentieren plus die passenden Werte in der .env. Mock- und echte Quellen dürfen
# nebeneinander stehen — 'wg sync --source <name>' wählt gezielt aus.
#
# VIER BLÖCKE, EIN NUMMERNKREIS. 'target.scope' gilt je Block, also braucht jeder Fachbereich
# einen eigenen. Die Seiten liegen trotzdem in *einer* Confluence-Instanz, und Seiten-IDs sind
# dort instanzweit eindeutig. Deshalb teilen sich alle Blöcke das Präfix 'confluence' und
# erklären das mit 'shared_id_prefix: true'. Ohne diese Erklärung bricht der Start ab — und das
# zu Recht: Ein geteiltes Präfix ohne gemeinsamen Nummernkreis hieße, dass zwei Quellen einander
# überschreiben (§7.5). Mit Präfixen je Block ließe sich umgekehrt ein Verweis über die
# Space-Grenze gar nicht aufschreiben: Der Adapter kennt nur die Seiten-ID des Ziels, nicht den
# Block, der sie einmal holen wird.
#
# Die Scopes müssen vorher in config/wissensgraph.yaml unter 'scopes:' stehen, sonst meldet
# 'wg doctor' einen Konfigurationsfehler.
