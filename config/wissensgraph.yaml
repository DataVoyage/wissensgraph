# Kernkonfiguration des Wissensgraphen (§6.3).
#
# In dieser Datei stehen KEINE Secrets. Werte, die sich zwischen Umgebungen unterscheiden oder
# vertraulich sind, stehen als ${WG_...}-Platzhalter hier und kommen zur Startzeit aus der
# Prozessumgebung. Ein nicht auflösbarer Platzhalter ist ein Startfehler (§6.1 Regel 3).

stores:
  shared:
    dsn: ${WG_DB_SHARED_DSN}
    # Optionale, nur lesende Rolle für den MCP-Zugang (§20.1). Ohne Angabe wird dieselbe Rolle
    # mit erzwungenem 'default_transaction_read_only' benutzt — schwächer, aber immer da.
    readonly_dsn: ${WG_DB_SHARED_READONLY_DSN:-}
    allow_remote: true
  personal:
    dsn: ${WG_DB_PERSONAL_DSN}
    # Leitprinzip 2: Der personal-Store verlässt den lokalen Rechner nicht. Zeigt der DSN nicht
    # auf einen lokalen Host, bricht der Start ab (§6.5).
    allow_remote: false

scopes:
  - name: global
    store: shared
    description: unternehmensweit gültiges Wissen
  - name: finance
    store: shared
  - name: engineering
    store: shared
  - name: personal
    store: personal
  # Ein Scope je Fachbereich, nicht je technischer Quelle: Ein Confluence-Space und das
  # Jira-Projekt daneben gehören inhaltlich zusammen, und der Scope ist die Einheit, über die
  # 'embed', 'cluster' und 'relations' laufen. Diese vier gehören zu den auskommentierten
  # Live-Quellen in sources.yaml; ohne sie bricht deren Aktivierung mit einem
  # Konfigurationsfehler ab. Sie kosten nichts, solange keine Quelle auf sie zeigt.
  - name: flwoperativesysteme
    store: shared
    description: Fleischwerke Operative Systeme und Prozesse
  - name: klfleischwerke
    store: shared
    description: Kaufland Fleischwerke Hauptdokumentation
  - name: data-analytics
    store: shared
    description: Datenmanagement und Analytik
  - name: iot-platform
    store: shared
    description: IoT-Edge-Plattform

# Die Taxonomie ist Konfiguration, nicht Code (§7.2). Eine neue Quelle bringt einen neuen
# type-Wert mit; das Datenbankschema ändert sich dafür nicht.
concept_types:
  - name: Confluence Page
    stores: [shared]
    source_mirrored: true
  - name: Jira Issue
    stores: [shared]
    source_mirrored: true
  - name: Process
    stores: [shared]
    source_mirrored: true
  - name: Cluster
    stores: [shared, personal]
    source_mirrored: false
  - name: Project
    stores: [personal]
    source_mirrored: false
  - name: Note
    stores: [personal]
    source_mirrored: false

# Die Unterscheidung steuert das Traversierungsverhalten (abwärts vs. seitwärts) und die
# Definition eines losen Knotens (§7.7).
edge_kinds:
  structural: [member, related]
  semantic: [depends_on, extends, supersedes, references, contradicts, implements]

clustering:
  neighbors_k: 8
  # Ab welcher Ähnlichkeit zwei Konzepte im k-NN-Graphen überhaupt verbunden werden.
  #
  # Der Wert gehört zum *Bestand* und nicht zum Programm — an echten Daten teuer gelernt: Die
  # frühere Vorgabe 0.55 filterte in einem thematisch homogenen Bestand (2.069 Seiten
  # SAP-BTP-Dokumentation) gar nichts. Sämtliche k-NN-Kanten lagen darüber, der Median der
  # nächsten Nachbarn bei 0.87. Der Graph verschmolz zu *einer* Komponente aus allen 2.069
  # Dokumenten, und die Cluster entstanden anschließend nur noch durch den Notbehelf, der zu
  # große Komponenten rekursiv zerteilt. Dass dabei brauchbare Themen herauskamen, spricht für
  # jenen Mechanismus — entworfen ist er dafür nicht.
  #
  # 0.80 ist gemessen und nicht geraten. Verglichen wurden echte Läufe über denselben Bestand,
  # geprüft an den Querverweisen, die die Autoren selbst gesetzt haben — das Embedding sieht
  # nur Titel und Beschreibung, nie die Links:
  #
  #   Schwelle | Abdeckung | Verweise im selben Cluster | ggü. Zufall
  #   ---------|-----------|----------------------------|------------
  #   0.55     |   36,2 %  |          54,4 %            |    63x
  #   0.70     |   33,9 %  |          60,6 %            |    68x
  #   0.80     |   39,1 %  |          55,4 %            |    67x
  #
  # Ein heterogener Bestand — Confluence quer über mehrere Fachbereiche — braucht wieder einen
  # niedrigeren Wert. Die Automatisierungs-Ansicht (§17.2, Ansicht 7) ist genau dafür da:
  # Parameter setzen, Probelauf, vergleichen.
  min_similarity: 0.80
  # Bewusst 3 und nicht 2: Mit 2 stieg die Abdeckung auf 55,3 %, die Verweistreue fiel aber auf
  # 37,8 % — ein Paar ist kein Thema, und ein Cluster aus zweien sagt weniger als die Kante
  # zwischen ihnen.
  min_cluster_size: 3
  max_cluster_size: 25
  stability_runs: 2
  related_cluster_top_n: 3
  relabel_on_member_change_pct: 20

orphans:
  loose_threshold: 1
  proximity_top_n: 30
  # Die beiden Grenzen der Nähe-Stufe (§15.2b). Darüber wird ohne Rückfrage geschrieben,
  # dazwischen entscheidet das Modell, darunter wird verworfen.
  #
  # Beide Werte sind an echten Daten neu gesetzt, aus demselben Grund wie beim Clustering: Die
  # alten (0.85 / 0.60) stammen aus den Testkorpora und passten nicht zu einem thematisch
  # homogenen Bestand. Gemessen an 2.269 Konzepten mit je 30 Nachbarn liegt der Median einer
  # Nachbarschaft bei 0.791, das 90. Perzentil bei 0.857:
  #
  #   Band  | auto | zum Modell | automatisch geschrieben
  #   ------|------|------------|------------------------
  #   0.60  | 0.85 |     59.946 |         8.117
  #   0.85  | 0.93 |      7.069 |         1.048
  #
  # Das alte Band ließ 88 % aller Nachbarpaare ans Modell — es filterte nicht, es reichte durch;
  # ein Lauf brauchte damit fast eine halbe Stunde. Das neue beginnt beim 90. Perzentil: Nur was
  # klar überdurchschnittlich ähnlich ist, ist überhaupt eine Frage wert.
  #
  # Die obere Grenze steigt mit, und das ist die wichtigere Änderung: Bei 0.85 wurden 8.117 Paare
  # *ohne jede Prüfung* verbunden — in einem Bestand, in dem 12 % aller Nachbarschaften diesen
  # Wert erreichen, ist das keine Auszeichnung mehr. 0.93 trifft die eindeutigsten anderthalb
  # Prozent; alles andere geht den Weg über eine Entscheidung.
  proximity_auto_commit: 0.93
  proximity_candidate_band: 0.85
  use_llm: true
  cluster_suggestion_limit: 2
  cluster_preview_members: 15
  # Wie viele Cluster Aufruf A überhaupt zu sehen bekommt, vorausgewählt über die Nähe zum
  # Zentroid (§15.3). Ohne diese Grenze ging die vollständige Übersicht in jede Frage: bei 188
  # Clustern gemessene 18.727 Token je Aufruf — fünfzigmal so viel wie eine Beziehungsfrage,
  # und das je losem Knoten erneut. Die Kosten wuchsen mit dem Produkt aus Waisen und Clustern.
  cluster_candidate_top_n: 20
  min_confidence: 0.60

traversal:
  default_hops: 2
  max_hops: 5
  max_nodes: 400
  ranking:
    hop_weight: 0.5
    density_weight: 0.3
    recency_weight: 0.2
    recency_half_life_days: 90

# Harte Obergrenze je Lauf (§11.6). Der Wächter ist der Schutz davor, dass ein fehlkonfigurierter
# Lauf unbemerkt große Mengen Token verbraucht.
# Die Werte stehen als Platzhalter und nicht als Zahlen, weil sie genau das sind, was §6.2 unter
# "laufbezogene Parameter" fasst: Auf einem Entwicklerrechner will man den Rahmen eng ziehen, im
# Betrieb weit — und beides ohne Codeänderung und ohne eine zweite Config-Datei.
budget:
  max_model_calls_per_run: ${WG_BUDGET_MAX_MODEL_CALLS_PER_RUN:-2000}
  max_estimated_cost_per_run_eur: ${WG_BUDGET_MAX_COST_PER_RUN_EUR:-5.0}
  on_exceed: ${WG_BUDGET_ON_EXCEED:-abort}

api:
  host: ${WG_API_HOST:-0.0.0.0}
  port: ${WG_API_PORT:-8080}
  auth_mode: ${WG_API_AUTH_MODE:-token}
  token: ${WG_API_TOKEN:-}
  cors_origins:
    - ${WG_API_CORS_ORIGINS:-http://localhost:5173}

mcp:
  # 'http' öffnet einen Streamable-HTTP-Endpunkt, 'stdio' bindet den Server als Unterprozess ein.
  transport: ${WG_MCP_TRANSPORT:-http}
  # Loopback als Vorgabe: Der Endpunkt kennt keine Authentifizierung. Im Container steht 0.0.0.0,
  # weil eine Bindung an Loopback dort nicht nach außen reicht (§20.3).
  host: ${WG_MCP_HOST:-127.0.0.1}
  port: ${WG_MCP_PORT:-8800}
  path: ${WG_MCP_PATH:-/mcp}

logging:
  level: ${WG_LOG_LEVEL:-INFO}
  format: ${WG_LOG_FORMAT:-json}

database:
  pool_size: ${WG_DB_POOL_SIZE:-5}

embedding_dim: ${WG_EMBEDDING_DIM}
broker_url: ${WG_BROKER_URL:-}
personal_allow_remote_models: ${WG_PERSONAL_ALLOW_REMOTE_MODELS:-false}
