# Gesamter Stack in Containern (§5).
#
# Kein Dienst setzt eine Installation auf dem Host voraus außer Docker selbst. Damit läuft das
# Setup unverändert unter Windows, macOS und Linux.
#
# Profile (§5.4):
#   dev      alle Dienste inkl. mock-sources   -> lokale Entwicklung gegen Mocks
#   live     alle außer mock-sources           -> Betrieb gegen echte Quellsysteme
#   minimal  db-*, api, ui                     -> UI-Arbeit ohne Hintergrundläufe
#   test     db-*, mock-sources                -> Integrationstests in CI

name: wissensgraph

# ---------------------------------------------------------------------------
# Netzwerksegmentierung (§5.2)
# ---------------------------------------------------------------------------
networks:
  # Der personal-Store liegt in einem Netz ohne Ausgang. Leitprinzip 2 ist damit nicht nur eine
  # Absprache, sondern eine Eigenschaft des Deployments.
  wg-personal:
    internal: true
  wg-shared:
  wg-edge:

volumes:
  pg-personal-data:
  pg-shared-data:

# ---------------------------------------------------------------------------
# Wiederverwendbare Bausteine
# ---------------------------------------------------------------------------
# Herkunft der Images (§5.3).
#
# 'WG_DOCKER_REGISTRY' wird jedem Image von Docker Hub vorangestellt und endet auf '/', etwa
# 'artifactory.firma.de/docker-remote/'. Ohne Wert bleibt der Name unverändert und Docker zieht
# von Docker Hub — die Vorgabe ist die, die ohne Einrichtung funktioniert.
#
# 'WG_IMAGE_PREFIX' und 'WG_IMAGE_TAG' betreffen die *eigenen* Images. Sie stehen getrennt, weil
# es zwei verschiedene Richtungen sind: Das eine ist, woher fremde Images kommen, das andere,
# wohin die selbst gebauten gehören. In einer abgeschlossenen Umgebung sind beide gesetzt, in der
# Entwicklung keines von beiden.
x-build-args: &build-args
  WG_DOCKER_REGISTRY: ${WG_DOCKER_REGISTRY:-}
  WG_UV_IMAGE: ${WG_UV_IMAGE:-ghcr.io/astral-sh/uv:0.9.21}
  UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-}
  UV_INDEX: ${UV_INDEX:-}
  UV_NATIVE_TLS: ${UV_NATIVE_TLS:-false}
  NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/api.Dockerfile
    args: *build-args
  image: ${WG_IMAGE_PREFIX:-}wissensgraph-app:${WG_IMAGE_TAG:-local}

# Proxy im Unternehmensnetz (§5.2).
#
# Erreicht ein Container das Internet nur über einen Proxy, steht der als HTTP_PROXY in der
# Umgebung — und jede Bibliothek, die ihre Umgebung liest, schickt dann **auch** den Aufruf an den
# Nachbarcontainer dorthin. Der Proxy kennt 'mock-sources' nicht, kann den Namen nicht auflösen
# und antwortet mit einem Fehler, der wie ein Ausfall des Nachbarn aussieht.
#
# Deshalb stehen die internen Namen fest in NO_PROXY und werden nicht dem Betreiber überlassen:
# Ein vergessener Name fällt erst auf, wenn genau dieser Dienst angesprochen wird. Wer eigene
# Ausnahmen braucht, setzt WG_NO_PROXY — sie kommen HINZU und ersetzen nichts.
#
# 'host.docker.internal' steht bewusst dabei: Dort läuft der lokale Modellserver. Ginge sein
# Verkehr über den Proxy, verließen persönliche Inhalte den Rechner, und ein Anbieter mit
# 'local: true' wäre keiner mehr (Leitprinzip 2, §11.5).
#
# Klein- und Großschreibung beide, weil nicht einheitlich ist, welche eine Bibliothek liest.
x-proxy: &proxy
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  NO_PROXY: &no-proxy db-shared,db-personal,broker,mock-sources,api,worker,mcp,ui,host.docker.internal,localhost,127.0.0.1,::1${WG_NO_PROXY:+,${WG_NO_PROXY}}
  no_proxy: *no-proxy

x-app-environment: &app-environment
  <<: *proxy
  WG_ENV: ${WG_ENV:-dev}
  WG_CONFIG_DIR: /app/config
  WG_LOG_LEVEL: ${WG_LOG_LEVEL:-INFO}
  WG_LOG_FORMAT: ${WG_LOG_FORMAT:-json}
  # Innerhalb der Container gelten die Compose-Servicenamen, nicht die Host-Ports.
  WG_DB_SHARED_DSN: postgresql+psycopg://${WG_POSTGRES_USER:-wg}:${WG_POSTGRES_PASSWORD:-wg}@db-shared:5432/wg_shared
  WG_DB_PERSONAL_DSN: postgresql+psycopg://${WG_POSTGRES_USER:-wg}:${WG_POSTGRES_PASSWORD:-wg}@db-personal:5432/wg_personal
  # Ohne Wert benutzt der nur lesende Zugang (§20.1) dieselbe Rolle mit erzwungenem
  # 'default_transaction_read_only'. Wer eine eigene, nur lesende Datenbankrolle anlegt, trägt
  # deren DSN hier ein — dann hält der Schutz auch gegen einen kompromittierten Prozess.
  WG_DB_SHARED_READONLY_DSN: ${WG_DB_SHARED_READONLY_DSN:-}
  WG_EMBEDDING_DIM: ${WG_EMBEDDING_DIM:?WG_EMBEDDING_DIM muss gesetzt sein - siehe .env.example}
  WG_API_TOKEN: ${WG_API_TOKEN:-}
  WG_API_AUTH_MODE: ${WG_API_AUTH_MODE:-token}
  WG_API_CORS_ORIGINS: ${WG_API_CORS_ORIGINS:-http://localhost:5173}
  WG_BROKER_URL: redis://broker:6379/0
  WG_PERSONAL_ALLOW_REMOTE_MODELS: ${WG_PERSONAL_ALLOW_REMOTE_MODELS:-false}
  WG_BUDGET_MAX_MODEL_CALLS_PER_RUN: ${WG_BUDGET_MAX_MODEL_CALLS_PER_RUN:-2000}
  WG_BUDGET_MAX_COST_PER_RUN_EUR: ${WG_BUDGET_MAX_COST_PER_RUN_EUR:-5.0}
  WG_BUDGET_ON_EXCEED: ${WG_BUDGET_ON_EXCEED:-abort}
  WG_PROVIDER_GEMINI__API_KEY: ${WG_PROVIDER_GEMINI__API_KEY:-}
  WG_PROVIDER_VERTEX__PROJECT: ${WG_PROVIDER_VERTEX__PROJECT:-}
  WG_PROVIDER_VERTEX__LOCATION: ${WG_PROVIDER_VERTEX__LOCATION:-europe-west4}
  WG_PROVIDER_VERTEX__CREDENTIALS_FILE: ${WG_PROVIDER_VERTEX__CREDENTIALS_FILE:-}
  WG_PROVIDER_OPENAI__BASE_URL: ${WG_PROVIDER_OPENAI__BASE_URL:-}
  WG_PROVIDER_OPENAI__API_KEY: ${WG_PROVIDER_OPENAI__API_KEY:-}
  # Der lokale Modellserver laeuft auf dem Host, nicht im Compose-Netz. 'host.docker.internal'
  # ist der plattformunabhaengige Weg dorthin; ohne ihn bleiben persoenliche Konzepte ohne
  # Embedding (§11.5).
  WG_PROVIDER_OLLAMA__BASE_URL: ${WG_PROVIDER_OLLAMA__BASE_URL:-http://host.docker.internal:11434/v1}
  WG_SOURCE_CONFLUENCE__BASE_URL: ${WG_SOURCE_CONFLUENCE__BASE_URL:-http://mock-sources:8090/confluence}
  WG_SOURCE_CONFLUENCE__TOKEN: ${WG_SOURCE_CONFLUENCE__TOKEN:-}
  WG_SOURCE_JIRA__BASE_URL: ${WG_SOURCE_JIRA__BASE_URL:-http://mock-sources:8090/jira}
  WG_SOURCE_JIRA__TOKEN: ${WG_SOURCE_JIRA__TOKEN:-}
  # Die SAP-Doku als Quelle für Tests mit echten Daten. Der Pfad zeigt in das gemountete
  # Verzeichnis; die Grenze deckelt einen ersten Lauf auf eine überschaubare Menge.
  WG_SOURCE_SAPDOCS__DIR: ${WG_SOURCE_SAPDOCS__DIR:-/app/.testdaten/btp-cloud-platform/docs}
  WG_SOURCE_SAPDOCS__LIMIT: ${WG_SOURCE_SAPDOCS__LIMIT:-0}

x-app-volumes: &app-volumes
  # Config und Secrets read-only in die Container (§5.3). Ein Prozess soll seine eigene
  # Konfiguration nicht verändern können.
  - ./config:/app/config:ro
  - ./secrets:/app/secrets:ro
  # Ausgechecktes Quellmaterial für Tests mit echten Daten (SAP-docs, CC-BY-4.0). Read-only und
  # git-ignoriert: Es wird beschafft, nicht versioniert. Fehlt das Verzeichnis, legt Docker es
  # leer an und die Quelle meldet sich als 'degraded' — sie hält nichts auf (§8.3).
  - ./.testdaten:/app/.testdaten:ro

services:
  # -------------------------------------------------------------------------
  # Datenbanken — zwei Dienste statt zweier Datenbanken in einem Dienst (§5.1).
  # Das macht die Trennung im Deployment sichtbar und den späteren Umzug des
  # shared-Stores auf einen zentralen Server zu einer reinen Konfigurationsänderung.
  # -------------------------------------------------------------------------
  db-shared:
    image: ${WG_DOCKER_REGISTRY:-}pgvector/pgvector:pg16
    profiles: [dev, live, minimal, test]
    environment:
      POSTGRES_USER: ${WG_POSTGRES_USER:-wg}
      POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:-wg}
      POSTGRES_DB: wg_shared
    # Kein Init-Skript für die Erweiterungen: Die Migration legt 'vector', 'pg_trgm' und
    # 'uuid-ossp' selbst an (§7.3). Damit gilt für eine von Hand angelegte oder in einem Test
    # erzeugte Datenbank dasselbe wie für diesen Container — es gibt nur eine Stelle, die das tut.
    volumes:
      - pg-shared-data:/var/lib/postgresql/data
    ports:
      - "${WG_DB_SHARED_HOST_PORT:-5433}:5432"
    networks: [wg-shared]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WG_POSTGRES_USER:-wg} -d wg_shared"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-personal:
    image: ${WG_DOCKER_REGISTRY:-}pgvector/pgvector:pg16
    profiles: [dev, live, minimal, test]
    environment:
      POSTGRES_USER: ${WG_POSTGRES_USER:-wg}
      POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:-wg}
      POSTGRES_DB: wg_personal
    volumes:
      - pg-personal-data:/var/lib/postgresql/data
    # Bewusst KEINE Port-Freigabe zum Host. Das Netz wg-personal ist 'internal: true' (§5.2);
    # eine Freigabe wäre dort ohnehin wirkungslos, und der Verzicht macht die Absicht sichtbar:
    # An den personal-Store kommt nur heran, wer im selben Docker-Netz liegt — also api, worker
    # und mcp. Werkzeuge gegen diesen Store laufen deshalb im Container (§19), nicht auf dem Host.
    networks: [wg-personal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WG_POSTGRES_USER:-wg} -d wg_personal"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker:
    image: ${WG_DOCKER_REGISTRY:-}redis:7-alpine
    profiles: [dev, live]
    networks: [wg-shared]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # Anwendung — drei Dienste, ein Image, drei Startbefehle (§5.1)
  # -------------------------------------------------------------------------
  api:
    <<: *app-image
    profiles: [dev, live, minimal]
    environment: *app-environment
    volumes: *app-volumes
    ports:
      - "${WG_API_HOST_PORT:-8080}:8080"
    # Nur api, worker und mcp haben Zugang zu beiden Datenbanknetzen (§5.2).
    networks: [wg-personal, wg-shared, wg-edge]
    depends_on:
      db-shared:
        condition: service_healthy
      db-personal:
        condition: service_healthy

  worker:
    <<: *app-image
    profiles: [dev, live]
    # Der Worker nimmt Jobs aus der Redis-Queue entgegen und führt die Läufe aus (§5.1, §16.3).
    # Er migriert nicht: Migrationen laufen ausschließlich im api-Service (§5.5).
    command: ["wg", "worker"]
    environment: *app-environment
    volumes: *app-volumes
    networks: [wg-personal, wg-shared]
    # Der Healthcheck des Images fragt /healthz auf Port 8080 ab — den gibt es nur im
    # api-Service. Ohne diese Zeile stünde ein einwandfrei arbeitender Worker dauerhaft als
    # 'unhealthy' da, und die Anzeige wäre wertlos für den Fall, auf den es ankommt.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      broker:
        condition: service_healthy

  mcp:
    <<: *app-image
    profiles: [dev, live]
    # Der MCP-Server spricht Streamable HTTP (§18) und ist unter http://<host>:8800/mcp
    # erreichbar. Ein Agent bindet ihn als URL ein; er muss den Prozess nicht selbst starten.
    #
    # Der Endpunkt kennt KEINE Authentifizierung, und er schreibt in den persönlichen Store.
    # Die Absicherung liegt damit vollständig im Netz: Die Portfreigabe unten gilt für den
    # Rechner, auf dem der Stack läuft. Wer den Stack auf einem erreichbaren Host betreibt,
    # bindet sie an die Loopback-Adresse (WG_MCP_HOST_BIND=127.0.0.1) oder stellt einen
    # absichernden Reverse-Proxy davor (§20.3).
    command: ["wg", "mcp"]
    environment:
      <<: *app-environment
      # 0.0.0.0 im Container: Eine Bindung an 127.0.0.1 wäre nur im Container erreichbar und die
      # Portfreigabe damit wirkungslos. Nach außen entscheidet die Adresse in 'ports'.
      WG_MCP_TRANSPORT: http
      WG_MCP_HOST: 0.0.0.0
      # Der Port steht an EINER Stelle: Er geht an den Prozess, an die Freigabe und an den
      # Healthcheck. Nagelte man ihn hier fest, hätte ein WG_MCP_PORT in der .env keine Wirkung
      # auf den Container — und der Irrtum fiele erst auf, wenn niemand den Server erreicht.
      WG_MCP_PORT: ${WG_MCP_PORT:-8800}
      WG_MCP_PATH: ${WG_MCP_PATH:-/mcp}
    volumes: *app-volumes
    ports:
      - "${WG_MCP_HOST_BIND:-0.0.0.0}:${WG_MCP_HOST_PORT:-8800}:${WG_MCP_PORT:-8800}"
    # Zusätzlich zu beiden Datenbanknetzen liegt er im Randnetz — dort kommt der Verkehr vom
    # Host an, genau wie bei der API.
    networks: [wg-personal, wg-shared, wg-edge]
    # Der Healthcheck des Images fragt /healthz auf 8080 ab; die gibt es hier nicht. Geprüft
    # wird stattdessen, dass der Port steht — mehr sagt ein Lebenszeichen ohnehin nicht aus:
    # Ein MCP-Aufruf verlangt eine ausgehandelte Sitzung, und die im Healthcheck aufzubauen
    # hieße, bei jedem Durchlauf eine Agentensitzung zu eröffnen.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', ${WG_MCP_PORT:-8800}), 3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Mock-Quellen (§9) — nur in den Profilen dev und test.
  #
  # Gemockt wird das Quellsystem, nicht der Adapter: Die echten Adapter laufen unverändert
  # dagegen, inklusive Paginierung, Rate-Limits und Fehlerbehandlung (§9.1). Der Dienst liegt
  # allein im Netz wg-shared — an den personal-Store kommt er nicht heran, und er braucht es
  # auch nicht: Quellen speisen ausschließlich den geteilten Store.
  # -------------------------------------------------------------------------
  mock-sources:
    <<: *app-image
    profiles: [dev, test]
    command: ["wg", "mock-sources", "--fixtures", "/app/fixtures"]
    environment: *app-environment
    volumes:
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
      # Die Seed-Daten kommen als Bind-Mount und nicht ins Image: So wirkt eine geänderte
      # Fixture sofort, ohne neuen Build — und das Anwendungsimage bleibt frei von Testdaten.
      - ./fixtures:/app/fixtures:ro
    ports:
      - "${WG_MOCK_HOST_PORT:-8090}:8090"
    # Der Mock-Server braucht weder Datenbank noch Broker — er kennt den Graphen nicht (§9.1).
    networks: [wg-shared]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/_control/state', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # Web-UI — erreicht ausschließlich api (§5.2)
  # -------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
      args: *build-args
    image: ${WG_IMAGE_PREFIX:-}wissensgraph-ui:${WG_IMAGE_TAG:-local}
    profiles: [dev, live, minimal]
    environment:
      WG_UI_API_BASE_URL: ${WG_UI_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WG_UI_HOST_PORT:-5173}:80"
    networks: [wg-edge]
