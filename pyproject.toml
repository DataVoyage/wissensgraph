[project]
name = "wissensgraph"
version = "0.1.0"
description = "Wissensgraph — geteilter und persönlicher Wissensgraph mit Agenten- (MCP) und Mensch-Zugriff (Web-UI), gespeist aus synchronisierten, geclusterten und semantisch vernetzten Quellen."
readme = "README.md"
authors = [
    { name = "Melvin Neffle", email = "melvin.neffle@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.13",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.scripts]
wg = "wissensgraph.cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "faker>=28.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.6",
    "import-linter>=2.1",
    "mypy>=1.11",
    "types-PyYAML",
]

# ---------------------------------------------------------------------------
# ruff — Linting & Formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["wissensgraph"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
packages = ["wissensgraph"]
mypy_path = "src"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "unit: reine Domänen-/Logiktests ohne Infrastruktur",
    "contract: Adapter-/Router-Contract-Tests",
    "integration: Tests gegen echte Infrastruktur (DB, Mock-Server)",
    "guard: Sicherheits- und Invarianten-Tests (§20.1)",
]
addopts = "--cov=wissensgraph --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"

# ---------------------------------------------------------------------------
# coverage — Vorgabe: > 90 % (§22 des Architekturdokuments)
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/wissensgraph"]
branch = true
omit = [
    "*/cli.py",              # dünne Hülle, per E2E/CLI-Smoketest statt Unit-Coverage geprüft
    # Alembic lädt env.py und die Versionsskripte selbst und unter eigenen Modulnamen; die
    # Zeilenabdeckung eines pytest-Laufs bildet das nicht ab. Geprüft werden sie dort, wo es
    # zählt: in den Integrationstests gegen eine echte PostgreSQL-Instanz, die das *Ergebnis*
    # der Migration untersuchen statt der ausgeführten Zeilen.
    "*/migrations/env.py",
    "*/migrations/versions/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------------------
# import-linter — erzwingt Leitprinzip 13 / §4.2: domain kennt keine infrastructure
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "wissensgraph"

[[tool.importlinter.contracts]]
name = "Domäne kennt keine Infrastruktur"
type = "forbidden"
source_modules = ["wissensgraph.domain"]
forbidden_modules = [
    "wissensgraph.infrastructure",
    "wissensgraph.api",
    "wissensgraph.cli",
    "wissensgraph.migrations",
]

[[tool.importlinter.contracts]]
name = "Ports kennen keine Infrastruktur"
type = "forbidden"
source_modules = ["wissensgraph.ports"]
forbidden_modules = [
    "wissensgraph.infrastructure",
]

[[tool.importlinter.contracts]]
# Die Migrationen sind die unterste Schicht: Sie beschreiben das Schema und dürfen dafür die
# Konfiguration lesen, aber nichts aus der Anwendung. Ohne diese Regel entsteht schnell ein
# Zyklus — infrastructure startet die Migration, und eine Migration greift auf ein Repository zu.
name = "Migrationen kennen die Anwendung nicht"
type = "forbidden"
source_modules = ["wissensgraph.migrations"]
forbidden_modules = [
    "wissensgraph.infrastructure",
    "wissensgraph.services",
    "wissensgraph.api",
    "wissensgraph.cli",
]

[[tool.importlinter.contracts]]
# §4.2 / Leitprinzip 13: Die Dienste sprechen mit den Ports, nicht mit SQLAlchemy. Ohne diese
# Regel wandert der erste 'select(...)' in einen Service, und die Kernoperation aus §10.2 ist
# nicht mehr ohne Datenbank testbar.
name = "Dienste kennen keine Infrastruktur"
type = "forbidden"
source_modules = ["wissensgraph.services"]
forbidden_modules = [
    "wissensgraph.infrastructure",
    "wissensgraph.api",
    "wissensgraph.cli",
]

[[tool.importlinter.contracts]]
# §8.2 Regel 2: "Der Adapter kennt weder 'concepts' noch SQL noch Scopes. Er liefert DTOs."
# Ohne diese Regel baut der erste Adapter, dem ein Feld fehlt, sich selbst einen Konzept-Entwurf
# zusammen — und das Versprechen aus §8.1, dass eine neue Quelle den Kern nicht anfasst, ist weg.
name = "Adapter kennen den Graphen nicht"
type = "forbidden"
source_modules = ["wissensgraph.infrastructure.adapters"]
forbidden_modules = [
    "wissensgraph.domain.concepts",
    "wissensgraph.domain.edges",
    "wissensgraph.domain.upsert",
    "wissensgraph.infrastructure.db",
    "wissensgraph.services",
    "wissensgraph.api",
]

[[tool.importlinter.contracts]]
# §9.1: Gemockt wird das Quellsystem, nicht der Adapter. Ein Mock-Server, der den Graphen kennt,
# wäre keiner mehr — er würde beweisen, dass der Kern mit einer Quelle umgehen kann, die er
# selbst gebaut hat.
name = "Mock-Quellen kennen den Graphen nicht"
type = "forbidden"
source_modules = ["wissensgraph.mocks"]
forbidden_modules = [
    "wissensgraph.domain",
    "wissensgraph.ports",
    "wissensgraph.services",
    "wissensgraph.infrastructure",
    "wissensgraph.api",
]

[[tool.importlinter.contracts]]
name = "Schichtenreihenfolge: Interface -> Services -> Domain/Ports"
type = "layers"
# Module in Klammern sind optional: Sie entstehen erst mit späteren Stufen des Stufenplans
# (§24) und sollen die Regel nicht schon vorher scheitern lassen.
# Die CLI steht über der API und nicht neben ihr: 'wg serve' ist der Startbefehl des
# api-Containers und führt erst die Migrationen aus, dann den Server (§5.5). Die Richtung ist
# damit festgelegt — die CLI darf die API starten, die API nie die CLI aufrufen.
# Ports stehen über der Domäne und nicht neben ihr: Ein Port beschreibt seine Operationen in
# Domänenbegriffen ('gib mir das Konzept zu dieser ID'), die Domäne kennt umgekehrt keinen Port.
layers = [
    "wissensgraph.cli",
    "wissensgraph.api | (wissensgraph.mcp)",
    "wissensgraph.services",
    "wissensgraph.ports",
    "wissensgraph.domain",
]
