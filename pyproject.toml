[project]
name = "wissensgraph"
version = "0.1.0"
description = "Wissensgraph — geteilter und persönlicher Wissensgraph mit Agenten- (MCP) und Mensch-Zugriff (Web-UI), gespeist aus synchronisierten, geclusterten und semantisch vernetzten Quellen."
readme = "README.md"
authors = [
    { name = "Melvin Neffle", email = "melvin.neffle@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.13",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.scripts]
wg = "wissensgraph.cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "faker>=28.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.6",
    "import-linter>=2.1",
    "mypy>=1.11",
    "types-PyYAML",
]

# ---------------------------------------------------------------------------
# ruff — Linting & Formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["wissensgraph"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
packages = ["wissensgraph"]
mypy_path = "src"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: reine Domänen-/Logiktests ohne Infrastruktur",
    "contract: Adapter-/Router-Contract-Tests",
    "integration: Tests gegen echte Infrastruktur (DB, Mock-Server)",
    "guard: Sicherheits- und Invarianten-Tests (§20.1)",
]
addopts = "--cov=wissensgraph --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"

# ---------------------------------------------------------------------------
# coverage — Vorgabe: > 90 % (§22 des Architekturdokuments)
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/wissensgraph"]
branch = true
omit = [
    "*/cli.py",              # dünne Hülle, per E2E/CLI-Smoketest statt Unit-Coverage geprüft
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------------------
# import-linter — erzwingt Leitprinzip 13 / §4.2: domain kennt keine infrastructure
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "wissensgraph"

[[tool.importlinter.contracts]]
name = "Domäne kennt keine Infrastruktur"
type = "forbidden"
source_modules = ["wissensgraph.domain"]
forbidden_modules = [
    "wissensgraph.infrastructure",
    "wissensgraph.api",
    "wissensgraph.cli",
]

[[tool.importlinter.contracts]]
name = "Ports kennen keine Infrastruktur"
type = "forbidden"
source_modules = ["wissensgraph.ports"]
forbidden_modules = [
    "wissensgraph.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Schichtenreihenfolge: Interface -> Services -> Domain/Ports"
type = "layers"
# Module in Klammern sind optional: Sie entstehen erst mit späteren Stufen des Stufenplans
# (§24) und sollen die Regel nicht schon vorher scheitern lassen.
layers = [
    "wissensgraph.api | wissensgraph.cli | (wissensgraph.mcp)",
    "(wissensgraph.services)",
    "(wissensgraph.domain) | (wissensgraph.ports)",
]
